<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/components/mc-navbar.js"></script>
    <script src="/components/skeleton-card.js"></script>
    <link rel="stylesheet" href="index.css">
    <title>校园活动照片墙 - 主页</title>
<base target="_blank">
</head>
<body>
    <mc-navbar icon-src="../image/logo.png" search-placeholder="搜索活动照片..."></mc-navbar>
    <div class="main-container">

    <!-- 轮播图 + 特色卡片 -->
    <section class="hero-section">
      <div class="carousel-wrapper">
        <div class="carousel-container" id="carousel">
          <div class="carousel-slide active">
            <img src="/src/20120705105354979.jpg" alt="轮播1">
            <div class="carousel-caption">
              <h2>精选活动推荐</h2>
              <p>发现最热门的校园活动</p>
            </div>
          </div>
          <div class="carousel-slide">
            <img src="/src/271fcc43dd6031c2a2e74935ee9373fe.jpg" alt="轮播2">
            <div class="carousel-caption">
              <h2>本周热门</h2>
              <p>同学们最爱的活动瞬间</p>
            </div>
          </div>
          <div class="carousel-slide">
            <img src="/src/aaa7ffb2f2785400cd4007243b9a8cad.jpg" alt="轮播3">
            <div class="carousel-caption">
              <h2>最新上传</h2>
              <p>最新收录的活动照片</p>
            </div>
          </div>
          <div class="carousel-dots">
            <span class="carousel-dot active" data-index="0"></span>
            <span class="carousel-dot" data-index="1"></span>
            <span class="carousel-dot" data-index="2"></span>
          </div>
        </div>
      </div>

      <div class="featured-grid" id="featured-grid"></div>
    </section>

    <!-- ========== 活动分类：明德 / 博学 / 笃行 / 尽美 ========== -->
    <section class="category-section" data-cat-section="明德">
      <div class="section-header">
        <h2 class="section-title">明德</h2>
        <a class="view-more" href="javascript:void(0)" data-cat="明德">查看更多 →</a>
      </div>
      <div class="two-row-grid" id="grid-明德"></div>
    </section>

    <section class="category-section" data-cat-section="博学">
      <div class="section-header">
        <h2 class="section-title">博学</h2>
        <a class="view-more" href="javascript:void(0)" data-cat="博学">查看更多 →</a>
      </div>
      <div class="two-row-grid" id="grid-博学"></div>
    </section>

    <section class="category-section" data-cat-section="笃行">
      <div class="section-header">
        <h2 class="section-title">笃行</h2>
        <a class="view-more" href="javascript:void(0)" data-cat="笃行">查看更多 →</a>
      </div>
      <div class="two-row-grid" id="grid-笃行"></div>
    </section>

    <section class="category-section" data-cat-section="尽美">
      <div class="section-header">
        <h2 class="section-title">尽美</h2>
        <a class="view-more" href="javascript:void(0)" data-cat="尽美">查看更多 →</a>
      </div>
      <div class="two-row-grid" id="grid-尽美"></div>
    </section>

    <!-- ========== 全部照片 ========== -->
    <section class="cards-section" id="cards-section">
      <h2 class="section-title">
        全部照片
        <span class="filter-chip" id="filterChip" style="display:none;">
          <span id="filterChipText"></span>
          <a href="javascript:void(0)" id="filterChipClear">✕ 清除</a>
        </span>
      </h2>
      <div class="cards-container" id="cards-container"></div>
      <div class="load-more" id="load-more">
        <span class="load-more-text">向下滚动加载更多</span>
        <div class="load-more-spinner" style="display:none;">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="all-loaded" id="all-loaded" style="display:none;">已经到底了 ~</div>
    </section>
  </div>

  <style>
    /* ========== 分类模块标题栏 ========== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .view-more {
      font-size: 0.9rem;
      color: #ff8c42;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .view-more:hover {
      color: #ff6b1a;
      background: rgba(255, 140, 66, 0.1);
    }

    /* ========== 两行卡片网格（固定2行） ========== */
    .two-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-height: calc(2 * (280px * 0.5625 + 1.25rem + 28px + 80px + 2.5rem) + 1.5rem);
      overflow: hidden;
    }

    .category-section {
      margin-bottom: 3rem;
      border-top: 2px solid #e8e8e8;
      padding-top: 2rem;
    }

    .category-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .category-empty {
      grid-column: 1 / -1;
      color: #999;
      font-size: 14px;
      padding: 2rem 0;
      text-align: center;
    }

    /* 筛选 chip */
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #4a90d9;
      background: #f0f7ff;
      border: 1px solid #d0e3f7;
      border-radius: 20px;
      padding: 4px 14px;
      margin-left: 12px;
      vertical-align: middle;
    }

    .filter-chip a {
      color: #c0392b;
      text-decoration: none;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .section-header {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .view-more {
        font-size: 0.85rem;
      }
    }
  </style>

  <script>
    // 轮播图
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.carousel-dot');
    let currentSlide = 0;
    function showSlide(index) {
      slides.forEach((s, i) => s.classList.toggle('active', i === index));
      dots.forEach((d, i) => d.classList.toggle('active', i === index));
      currentSlide = index;
    }
    dots.forEach(dot => dot.addEventListener('click', () => showSlide(parseInt(dot.dataset.index))));
    setInterval(() => showSlide((currentSlide + 1) % slides.length), 5000);

    const API_BASE = '/api';
    const BASE_PATH = '.';
    const ITEMS_PER_ROW = 4;
    const ROWS_PER_LOAD = 3;
    const ITEMS_PER_LOAD = ITEMS_PER_ROW * ROWS_PER_LOAD;
    const CATEGORIES = ['明德', '博学', '笃行', '尽美'];

    const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=400';

    // ========== 图片地址解析 ==========
    // 完整路径（/ 或 http 开头）直接使用；
    // 相对文件名（seed 导入的旧数据）→ /pages/resource/<folder>/ 下找
    function resolveImage(path, folder) {
      if (!path) return FALLBACK_IMAGE;
      if (/^(https?:)?\//.test(path)) return path;
      return `/pages/resource/${folder}/${path}`;
    }

    function parseCategories(album) {
      try {
        if (album.categoriesJson) return JSON.parse(album.categoriesJson);
      } catch (e) { /* 忽略解析失败 */ }
      return album.category ? [album.category] : [];
    }

    // 后端数据 → 前端卡片格式转换
    function normalizeAlbum(data) {
      return {
        title: data.title,
        category: data.category,
        categories: data.categoriesJson ? JSON.parse(data.categoriesJson) : [data.category],
        categoryColors: data.categoryColorsJson ? JSON.parse(data.categoryColorsJson) : [],
        intro: data.intro,
        bilibili: data.bilibili,
        content: data.content,
        id: data.folder || data.id,
        folder: data.folder,
        cards: (data.photos || []).map(p => ({
          title: p.title,
          intro: p.intro,
          image: p.imagePath
        }))
      };
    }

    // 用「图集详情」数据填充卡片（全部照片区使用）
    function setupCard(sk, album, card) {
      sk.setAttribute('image', resolveImage(card.image, album.folder));
      sk.setAttribute('title', card.title);
      sk.setAttribute('intro', card.intro);
      sk.setAttribute('article-id', album.folder || album.id);
      sk.setAttribute('base-path', BASE_PATH);

      if (album.categories && Array.isArray(album.categories)) {
        sk.setAttribute('categories', JSON.stringify(album.categories));
        if (album.categoryColors && Array.isArray(album.categoryColors)) {
          sk.setAttribute('category-colors', JSON.stringify(album.categoryColors));
        }
      } else {
        sk.setAttribute('category', album.category || album.folder);
      }
    }

    // 用「图集列表」数据直接填充卡片（分类区块使用，省去详情请求）
    function setupCardFromList(sk, album) {
      sk.setAttribute('image', resolveImage(album.coverImage, album.folder));
      sk.setAttribute('title', album.title);
      sk.setAttribute('intro', album.intro);
      sk.setAttribute('article-id', album.folder);
      sk.setAttribute('base-path', BASE_PATH);

      const cats = parseCategories(album);
      if (cats.length > 0) {
        sk.setAttribute('categories', JSON.stringify(cats));
        if (album.categoryColorsJson) {
          sk.setAttribute('category-colors', album.categoryColorsJson);
        }
      } else {
        sk.setAttribute('category', album.folder);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const featuredGrid = document.getElementById('featured-grid');
      const cardsContainer = document.getElementById('cards-container');
      const loadMore = document.getElementById('load-more');
      const loadMoreText = loadMore.querySelector('.load-more-text');
      const loadMoreSpinner = loadMore.querySelector('.load-more-spinner');
      const allLoaded = document.getElementById('all-loaded');
      const filterChip = document.getElementById('filterChip');
      const filterChipText = document.getElementById('filterChipText');

      let rawAlbums = [];        // API 原始顺序（最新优先），分类区块使用
      let allAlbums = [];        // 随机打乱，特色卡片/全部照片使用
      let currentIndex = 0;
      let isLoading = false;
      let activeCategory = null; // 全部照片区的分类筛选

      fetch(`${API_BASE}/albums`)
        .then(r => {
          if (!r.ok) throw new Error('图集列表加载失败');
          return r.json();
        })
        .then(res => {
          rawAlbums = res.data || [];
          allAlbums = [...rawAlbums].sort(() => Math.random() - 0.5);

          // ========== 右侧 2×2 特色卡片 ==========
          allAlbums.slice(0, 4).forEach(album => {
            const sk = document.createElement('skeleton-card');
            featuredGrid.appendChild(sk);

            fetch(`${API_BASE}/albums/folder/${encodeURIComponent(album.folder)}`)
              .then(r => r.json())
              .then(res => {
                const data = normalizeAlbum(res.data);
                if (data.cards && data.cards[0]) {
                  setupCard(sk, data, data.cards[0]);
                } else {
                  // 没有 photos 记录时，退回用封面渲染
                  setupCardFromList(sk, album);
                }
              })
              .catch(e => {
                console.error('加载特色卡片失败:', e);
                sk.remove();
              });
          });

          // ========== 四个分类区块（每类最多 8 个，按最新排序）==========
          CATEGORIES.forEach(cat => renderCategorySection(cat));

          // ========== “查看更多”→ 筛选下方全部照片 ==========
          document.querySelectorAll('.view-more[data-cat]').forEach(link => {
            link.addEventListener('click', () => applyFilter(link.dataset.cat));
          });

          // 清除筛选
          document.getElementById('filterChipClear').addEventListener('click', () => applyFilter(null));

          // ========== 初始加载全部照片 ==========
          loadMoreItems();

          // ========== 触底监听 ==========
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting && !isLoading && currentIndex < getFilteredAlbums().length) {
                loadMoreItems();
              }
            });
          }, { rootMargin: '100px' });

          observer.observe(loadMore);
        })
        .catch(e => {
          console.error(e);
          cardsContainer.innerHTML = `<div style="color:#e74c3c;padding:2rem;">⚠️ ${e.message}</div>`;
        });

      // ========== 分类区块渲染 ==========
      function renderCategorySection(cat) {
        const grid = document.getElementById('grid-' + cat);
        if (!grid) return;

        const albums = rawAlbums
          .filter(a => parseCategories(a).includes(cat))
          .slice(0, 8);

        if (albums.length === 0) {
          grid.innerHTML = `<div class="category-empty">该分类暂无活动</div>`;
          return;
        }

        albums.forEach(album => {
          const sk = document.createElement('skeleton-card');
          setupCardFromList(sk, album);
          grid.appendChild(sk);
        });
      }

      // ========== 全部照片：分类筛选 ==========
      function getFilteredAlbums() {
        if (!activeCategory) return allAlbums;
        return allAlbums.filter(a => parseCategories(a).includes(activeCategory));
      }

      function applyFilter(cat) {
        activeCategory = cat;
        currentIndex = 0;
        cardsContainer.innerHTML = '';
        allLoaded.style.display = 'none';
        loadMore.style.display = 'block';
        loadMoreText.style.display = 'block';
        loadMoreSpinner.style.display = 'none';

        if (cat) {
          filterChipText.textContent = '分类：' + cat;
          filterChip.style.display = 'inline-flex';
        } else {
          filterChip.style.display = 'none';
        }

        document.getElementById('cards-section').scrollIntoView({ behavior: 'smooth' });
        loadMoreItems();
      }

      // ========== 全部照片：滚动加载 ==========
      function loadMoreItems() {
        const filtered = getFilteredAlbums();
        if (isLoading || currentIndex >= filtered.length) return;
        isLoading = true;
        loadMoreText.style.display = 'none';
        loadMoreSpinner.style.display = 'block';

        const batch = filtered.slice(currentIndex, currentIndex + ITEMS_PER_LOAD);
        let loadedCount = 0;

        batch.forEach(album => {
          const sk = document.createElement('skeleton-card');
          cardsContainer.appendChild(sk);

          fetch(`${API_BASE}/albums/folder/${encodeURIComponent(album.folder)}`)
            .then(r => r.json())
            .then(res => {
              const data = normalizeAlbum(res.data);
              if (data.cards && data.cards[0]) {
                setupCard(sk, data, data.cards[0]);
              } else {
                // 没有 photos 记录时，退回用封面渲染
                setupCardFromList(sk, album);
              }
            })
            .catch(e => {
              console.error('加载卡片失败:', e);
              sk.remove();
            })
            .finally(() => {
              loadedCount++;
              if (loadedCount >= batch.length) {
                isLoading = false;
                currentIndex += batch.length;

                if (currentIndex >= filtered.length) {
                  loadMore.style.display = 'none';
                  allLoaded.style.display = 'block';
                } else {
                  loadMoreText.style.display = 'block';
                  loadMoreSpinner.style.display = 'none';
                }
              }
            });
        });
      }
    });

    // 导航栏搜索功能
    function setupNavbarSearch() {
      const navbar = document.querySelector('mc-navbar');
      if (!navbar) return;

      navbar.addEventListener('search', (e) => {
        const query = e.detail.query;
        performGlobalSearch(query);
      });
    }

    // 全局搜索
    async function performGlobalSearch(query) {
      if (!query || !query.trim()) return;

      try {
        const response = await fetch(`${API_BASE}/albums?search=${encodeURIComponent(query)}`);
        const res = await response.json();
        const albums = res.data || [];

        if (albums.length > 0) {
          window.location.href = `article.html?id=${encodeURIComponent(albums[0].folder)}`;
        }
      } catch (e) {
        console.error('搜索失败:', e);
      }
    }

    setupNavbarSearch();
  </script>
</body>
</html>
