<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../components/mc-navbar.js"></script>
    <script src="../../components/skeleton-card.js"></script>
    <!-- 粒子搜索依赖（particle-search 需要） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/EaselJS/1.0.2/easeljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenLite.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/plugins/CSSPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/easing/EasePack.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@900&display=swap" rel="stylesheet">
    <script src="../../components/particle-search.js"></script>
    <script src="../../components/bilibili-article-card.js"></script>
    <link rel="stylesheet" href="../../css/style.css">
    <title>校园照片墙 - 校园生活影像记录</title>
</head>
<body>
    <mc-navbar icon-type="grass" icon-color="#4a90d9" search-placeholder="搜索照片 / 图集..."></mc-navbar>

    <div class="page-wrapper">
        <div class="main-container">

            <!-- 轮播图 + 精选 2×2 -->
            <section class="hero-section">
                <div class="carousel-wrapper">
                    <div class="carousel-container" id="carousel">
                        <div class="carousel-slide active">
                            <img src="../../image/hero-1.jpg" alt="轮播1">
                            <div class="carousel-caption">
                                <h2>📷 校园影像志</h2>
                                <p>记录每一个闪光的校园瞬间</p>
                            </div>
                        </div>
                        <div class="carousel-slide">
                            <img src="../../image/hero-2.jpg" alt="轮播2">
                            <div class="carousel-caption">
                                <h2>🌸 四季校园</h2>
                                <p>春华秋实，每一季都有故事</p>
                            </div>
                        </div>
                        <div class="carousel-slide">
                            <img src="../../image/hero-3.jpg" alt="轮播3">
                            <div class="carousel-caption">
                                <h2>🎓 毕业季</h2>
                                <p>青春不散场，回忆永留存</p>
                            </div>
                        </div>
                        <div class="carousel-dots">
                            <span class="carousel-dot active" data-index="0"></span>
                            <span class="carousel-dot" data-index="1"></span>
                            <span class="carousel-dot" data-index="2"></span>
                        </div>
                    </div>
                </div>

                <div class="featured-grid" id="featured-grid"></div>
            </section>

            <!-- ========== 校园风光 ========== -->
            <section class="cards-section category-section">
                <div class="section-header">
                    <h2 class="section-title">校园风光</h2>
                    <a href="category.html?cat=校园风光" class="view-more">查看更多 →</a>
                </div>
                <div class="cards-container two-row-grid" id="cat-校园风光"></div>
            </section>

            <!-- ========== 课堂瞬间 ========== -->
            <section class="cards-section category-section">
                <div class="section-header">
                    <h2 class="section-title">课堂瞬间</h2>
                    <a href="category.html?cat=课堂瞬间" class="view-more">查看更多 →</a>
                </div>
                <div class="cards-container two-row-grid" id="cat-课堂瞬间"></div>
            </section>

            <!-- ========== 社团活动 ========== -->
            <section class="cards-section category-section">
                <div class="section-header">
                    <h2 class="section-title">社团活动</h2>
                    <a href="category.html?cat=社团活动" class="view-more">查看更多 →</a>
                </div>
                <div class="cards-container two-row-grid" id="cat-社团活动"></div>
            </section>

            <!-- ========== 体育竞技 ========== -->
            <section class="cards-section category-section">
                <div class="section-header">
                    <h2 class="section-title">体育竞技</h2>
                    <a href="category.html?cat=体育竞技" class="view-more">查看更多 →</a>
                </div>
                <div class="cards-container two-row-grid" id="cat-体育竞技"></div>
            </section>

            <!-- ========== 毕业季 ========== -->
            <section class="cards-section category-section">
                <div class="section-header">
                    <h2 class="section-title">毕业季</h2>
                    <a href="category.html?cat=毕业季" class="view-more">查看更多 →</a>
                </div>
                <div class="cards-container two-row-grid" id="cat-毕业季"></div>
            </section>

            <!-- ========== 粒子搜索区 ========== -->
            <section class="cards-section">
                <div class="section-header">
                    <h2 class="section-title">粒子搜索</h2>
                    <span class="search-hint">输入关键词，粒子为你拼出答案</span>
                </div>
                <div class="particle-search-section">
                    <particle-search id="particleSearch"></particle-search>
                </div>
            </section>

            <!-- ========== 编辑推荐（B站专栏卡片风格） ========== -->
            <section class="cards-section">
                <div class="section-header">
                    <h2 class="section-title">编辑推荐</h2>
                    <a href="gallery.html" class="view-more">进入照片墙 →</a>
                </div>
                <article-loader id="editorPicks" resource-path="../data" max-cards="4"></article-loader>
            </section>

            <!-- ========== 全部资源（瀑布流） ========== -->
            <section class="cards-section">
                <h2 class="section-title">全部图集</h2>
                <div class="masonry-grid" id="cards-container">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>正在加载图集...</p>
                    </div>
                </div>
                <div class="load-more" id="load-more">
                    <button class="load-more-btn" id="load-more-btn">向下滚动加载更多</button>
                </div>
                <div class="all-loaded" id="all-loaded" style="display:none;">已经到底了 ~</div>
            </section>
        </div>
    </div>

    <style>
        /* ========== 上部：轮播图 + 2×2 ========== */
        .hero-section {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .carousel-wrapper {
            border: 3px solid var(--accent-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #fff;
            height: 400px;
            position: relative;
            align-self: center;
        }

        .carousel-container { width: 100%; height: 400px; position: relative; overflow: hidden; }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .carousel-slide.active { opacity: 1; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }

        .carousel-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
            padding: 2rem;
        }
        .carousel-caption h2 { font-size: 20px; margin-bottom: 4px; }
        .carousel-caption p { font-size: 13px; opacity: 0.9; }

        .carousel-dots {
            position: absolute;
            bottom: 1rem; right: 1rem;
            display: flex; gap: 0.5rem;
        }
        .carousel-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer; transition: all 0.3s;
        }
        .carousel-dot.active { background: #fff; width: 30px; border-radius: 5px; }

        .featured-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1rem;
        }

        .cards-container { display: grid; }
        .two-row-grid { gap: 1.5rem; }

        .section-header .search-hint { font-size: 13px; color: var(--text-muted); }

        .particle-search-section {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 32px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .particle-search-section particle-search { width: 100%; max-width: 600px; }

        .cards-container { display: grid; }
        .two-row-grid { gap: 1.5rem; }

        @media (max-width: 900px) {
            .hero-section { grid-template-columns: 1fr; }
            .carousel-container { height: 250px; }
            .featured-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .featured-grid { grid-template-columns: 1fr; }
        }
    </style>

    <script src="../../js/app.js"></script>
    <script>
        const ITEMS_PER_ROW = 4;
        const ROWS_PER_LOAD = 3;
        const ITEMS_PER_LOAD = ITEMS_PER_ROW * ROWS_PER_LOAD;

        let allPhotos = [];
        let currentIndex = 0;
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            // 轮播
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.carousel-dot');
            let cur = 0;
            function showSlide(i) {
                slides.forEach((s, n) => s.classList.toggle('active', n === i));
                dots.forEach((d, n) => d.classList.toggle('active', n === i));
                cur = i;
            }
            dots.forEach(d => d.addEventListener('click', () => showSlide(parseInt(d.dataset.index))));
            setInterval(() => showSlide((cur + 1) % slides.length), 5000);

            // 加载全部数据
            const grid = document.getElementById('cards-container');
            try {
                allPhotos = await fetchAllPhotos();
            } catch (e) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>${escapeHtml(e.message)}</p></div>`;
                return;
            }

            renderFeatured();
            renderCategorySections();
            loadMoreItems();

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isLoading && currentIndex < allPhotos.length) {
                        loadMoreItems();
                    }
                });
            }, { rootMargin: '100px' });
            observer.observe(document.getElementById('load-more'));
        }

        // 右侧 2×2 精选
        function renderFeatured() {
            const grid = document.getElementById('featured-grid');
            allPhotos.slice(0, 4).forEach(p => grid.appendChild(createSkeletonCard(p)));
        }

        // 各分类 section（每类最多 8 张）
        function renderCategorySections() {
            const containers = {
                '校园风光': document.getElementById('cat-校园风光'),
                '课堂瞬间': document.getElementById('cat-课堂瞬间'),
                '社团活动': document.getElementById('cat-社团活动'),
                '体育竞技': document.getElementById('cat-体育竞技'),
                '毕业季':   document.getElementById('cat-毕业季')
            };
            allPhotos.forEach(p => {
                const cat = p.categories[0];
                const el = containers[cat];
                if (el && el.children.length < 8) {
                    el.appendChild(createSkeletonCard(p));
                }
            });
            // 空分类补提示
            Object.values(containers).forEach(el => {
                if (el && el.children.length === 0) {
                    el.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><p>暂无图集</p></div>';
                }
            });
        }

        // 全部资源：滚动分批
        function loadMoreItems() {
            if (isLoading || currentIndex >= allPhotos.length) return;
            isLoading = true;

            const grid = document.getElementById('cards-container');
            const loadMore = document.getElementById('load-more');
            const allLoaded = document.getElementById('all-loaded');
            const btn = document.getElementById('load-more-btn');

            const loading = grid.querySelector('.loading-state');
            if (loading) loading.remove();

            const batch = allPhotos.slice(currentIndex, currentIndex + ITEMS_PER_LOAD);
            batch.forEach(p => grid.appendChild(createPhotoCard(p)));

            currentIndex += batch.length;

            if (currentIndex >= allPhotos.length) {
                loadMore.style.display = 'none';
                allLoaded.style.display = 'block';
            }
        }

        document.getElementById('load-more-btn').addEventListener('click', loadMoreItems);

        // 编辑推荐：用 article-loader 加载随机图集（B站卡片风格）
        initArticleLoader();
        initParticleSearch();

        function initArticleLoader() {
            const loader = document.getElementById('editorPicks');
            if (!loader || !loader.shadowRoot) {
                // 组件尚未升级，延迟重试
                return setTimeout(initArticleLoader, 50);
            }
        }

        function initParticleSearch() {
            const ps = document.getElementById('particleSearch');
            if (!ps || !ps.shadowRoot) return setTimeout(initParticleSearch, 50);

            const shadow = ps.shadowRoot;
            const input = shadow.getElementById('inputText');
            const submitBtn = shadow.querySelector('input[type="submit"]');

            const doSearch = (kw) => {
                kw = (kw || '').trim();
                // 同步到导航栏搜索关键词并跳转照片墙
                sessionStorage.setItem('wall_kw', kw);
                window.location.href = 'gallery.html' + (kw ? `?cat=all` : '');
            };

            if (submitBtn) {
                submitBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    doSearch(input.value);
                });
            }
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        doSearch(input.value);
                    }
                });
            }
        }
    </script>
</body>
</html>
