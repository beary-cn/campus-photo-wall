<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/components/mc-navbar.js"></script>
    <script src="/components/skeleton-card.js"></script>
    <link rel="stylesheet" href="index.css">
    <title>校园活动照片墙 - 主页</title>
<base target="_blank">
<base target="_blank">
</head>
<body>
    <mc-navbar icon-src="../image/logo.png" search-placeholder="搜索活动照片..."></mc-navbar>
    <div class="main-container">

    <!-- 轮播图 + 特色卡片 -->
    <section class="hero-section">
      <div class="carousel-wrapper">
        <div class="carousel-container" id="carousel">
          <div class="carousel-slide active">
            <img src="/src/20120705105354979.jpg" alt="轮播1">
            <div class="carousel-caption">
              <h2>精选活动推荐</h2>
              <p>发现最热门的校园活动</p>
            </div>
          </div>
          <div class="carousel-slide">
            <img src="/src/271fcc43dd6031c2a2e74935ee9373fe.jpg" alt="轮播2">
            <div class="carousel-caption">
              <h2>本周热门</h2>
              <p>同学们最爱的活动瞬间</p>
            </div>
          </div>
          <div class="carousel-slide">
            <img src="/src/aaa7ffb2f2785400cd4007243b9a8cad.jpg" alt="轮播3">
            <div class="carousel-caption">
              <h2>最新上传</h2>
              <p>最新收录的活动照片</p>
            </div>
          </div>
          <div class="carousel-dots">
            <span class="carousel-dot active" data-index="0"></span>
            <span class="carousel-dot" data-index="1"></span>
            <span class="carousel-dot" data-index="2"></span>
          </div>
        </div>
      </div>

      <div class="featured-grid" id="featured-grid"></div>
    </section>

    <!-- ========== 活动介绍 ========== -->
    <section class="cards-section category-section">
      <div class="section-header">
        <h2 class="section-title">活动介绍</h2>
        <a href="redstone-intro.html" class="view-more">查看更多 →</a>
      </div>
      <div class="cards-container two-row-grid" id="redstone-intro-container"></div>
    </section>

    <!-- ========== 活动回顾 ========== -->
    <section class="cards-section category-section">
      <div class="section-header">
        <h2 class="section-title">活动回顾</h2>
        <a href="mechanism.html" class="view-more">查看更多 →</a>
      </div>
      <div class="cards-container two-row-grid" id="mechanism-container"></div>
    </section>

    <!-- ========== 精彩瞬间 ========== -->
    <section class="cards-section category-section">
      <div class="section-header">
        <h2 class="section-title">精彩瞬间</h2>
        <a href="redstone-machines.html" class="view-more">查看更多 →</a>
      </div>
      <div class="cards-container two-row-grid" id="redstone-machines-container"></div>
    </section>

    <!-- ========== 校园风光 ========== -->
    <section class="cards-section category-section">
      <div class="section-header">
        <h2 class="section-title">校园风光</h2>
        <a href="building.html" class="view-more">查看更多 →</a>
      </div>
      <div class="cards-container two-row-grid" id="building-container"></div>
    </section>

    <!-- ========== 集体相册 ========== -->
    <section class="cards-section category-section">
      <div class="section-header">
        <h2 class="section-title">集体相册</h2>
        <a href="schematics.html" class="view-more">查看更多 →</a>
      </div>
      <div class="cards-container two-row-grid" id="schematics-container"></div>
    </section>

    <!-- ========== 全部照片（保留原有） ========== -->
    <section class="cards-section">
      <h2 class="section-title">全部照片</h2>
      <div class="cards-container" id="cards-container"></div>
      <div class="load-more" id="load-more">
        <span class="load-more-text">向下滚动加载更多</span>
        <div class="load-more-spinner" style="display:none;">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="all-loaded" id="all-loaded" style="display:none;">已经到底了 ~</div>
    </section>
  </div>

  <style>
    /* ========== 分类模块标题栏 ========== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .view-more {
      font-size: 0.9rem;
      color: #ff8c42;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .view-more:hover {
      color: #ff6b1a;
      background: rgba(255, 140, 66, 0.1);
    }

    /* ========== 两行卡片网格（固定2行） ========== */
    .two-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-height: calc(2 * (280px * 0.5625 + 1.25rem + 28px + 80px + 2.5rem) + 1.5rem);
      overflow: hidden;
    }

    .category-section {
      margin-bottom: 3rem;
      border-top: 2px solid #e8e8e8;
      padding-top: 2rem;
    }

    .category-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    @media (max-width: 768px) {
      .section-header {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .view-more {
        font-size: 0.85rem;
      }
    }
  </style>

  <script>
    // 轮播图
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.carousel-dot');
    let currentSlide = 0;
    function showSlide(index) {
      slides.forEach((s, i) => s.classList.toggle('active', i === index));
      dots.forEach((d, i) => d.classList.toggle('active', i === index));
      currentSlide = index;
    }
    dots.forEach(dot => dot.addEventListener('click', () => showSlide(parseInt(dot.dataset.index))));
    setInterval(() => showSlide((currentSlide + 1) % slides.length), 5000);

    const RESOURCE_PATH = '/pages/resource';
    const BASE_PATH = '.';  // 当前页面在 pages/html/ 目录下，article.html 就在当前目录
    const ITEMS_PER_ROW = 4;
    const ROWS_PER_LOAD = 3;
    const ITEMS_PER_LOAD = ITEMS_PER_ROW * ROWS_PER_LOAD;

    // 辅助函数：设置卡片属性（包括 article-id 和 base-path）
    function setupCard(sk, folder, data, card) {
      sk.setAttribute('image', `${RESOURCE_PATH}/${folder}/${card.image}`);
      sk.setAttribute('title', card.title);
      sk.setAttribute('intro', card.intro);
      // 关键：设置 article-id 和 base-path
      sk.setAttribute('article-id', data.id || folder);
      sk.setAttribute('base-path', BASE_PATH);

      if (data.categories && Array.isArray(data.categories)) {
        sk.setAttribute('categories', JSON.stringify(data.categories));
        if (data.categoryColors && Array.isArray(data.categoryColors)) {
          sk.setAttribute('category-colors', JSON.stringify(data.categoryColors));
        }
      } else {
        sk.setAttribute('category', data.category || folder);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const featuredGrid = document.getElementById('featured-grid');
      const cardsContainer = document.getElementById('cards-container');
      const loadMore = document.getElementById('load-more');
      const loadMoreText = loadMore.querySelector('.load-more-text');
      const loadMoreSpinner = loadMore.querySelector('.load-more-spinner');
      const allLoaded = document.getElementById('all-loaded');

      const categoryContainers = {
        '活动介绍': document.getElementById('redstone-intro-container'),
        '活动回顾': document.getElementById('mechanism-container'),
        '精彩瞬间': document.getElementById('redstone-machines-container'),
        '校园风光': document.getElementById('building-container'),
        '集体相册': document.getElementById('schematics-container')
      };

      let allFolders = [];
      let currentIndex = 0;
      let isLoading = false;

      fetch(`${RESOURCE_PATH}/folders.json`)
        .then(r => {
          if (!r.ok) throw new Error('folders.json 加载失败');
          return r.json();
        })
        .then(folders => {
          allFolders = folders.sort(() => Math.random() - 0.5);

          // ========== 右侧 2×2 特色卡片 ==========
          allFolders.slice(0, 4).forEach(folder => {
            const sk = document.createElement('skeleton-card');
            featuredGrid.appendChild(sk);

            fetch(`${RESOURCE_PATH}/${folder}/${folder}.json`)
              .then(r => r.json())
              .then(data => {
                if (data.cards && data.cards[0]) {
                  setupCard(sk, folder, data, data.cards[0]);
                }
              })
              .catch(e => {
                console.error('加载特色卡片失败:', e);
                sk.remove();
              });
          });

          // ========== 按分类加载各模块 ==========
          allFolders.forEach(folder => {
            fetch(`${RESOURCE_PATH}/${folder}/${folder}.json`)
              .then(r => r.json())
              .then(data => {
                const categories = data.categories || [data.category || folder];
                categories.forEach(cat => {
                  const container = categoryContainers[cat];
                  if (container && container.children.length < 8) {
                    const card = data.cards && data.cards[0];
                    if (card) {
                      const sk = document.createElement('skeleton-card');
                      setupCard(sk, folder, data, card);
                      container.appendChild(sk);
                    }
                  }
                });
              })
              .catch(e => console.error('加载分类卡片失败:', e));
          });

          // ========== 初始加载全部照片 ==========
          loadMoreItems();

          // ========== 触底监听 ==========
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting && !isLoading && currentIndex < allFolders.length) {
                loadMoreItems();
              }
            });
          }, { rootMargin: '100px' });

          observer.observe(loadMore);
        })
        .catch(e => {
          console.error(e);
          cardsContainer.innerHTML = `<div style="color:#e74c3c;padding:2rem;">⚠️ ${e.message}</div>`;
        });

      function loadMoreItems() {
        if (isLoading || currentIndex >= allFolders.length) return;
        isLoading = true;
        loadMoreText.style.display = 'none';
        loadMoreSpinner.style.display = 'block';

        const batch = allFolders.slice(currentIndex, currentIndex + ITEMS_PER_LOAD);
        let loadedCount = 0;

        batch.forEach(folder => {
          const sk = document.createElement('skeleton-card');
          cardsContainer.appendChild(sk);

          fetch(`${RESOURCE_PATH}/${folder}/${folder}.json`)
            .then(r => r.json())
            .then(data => {
              if (data.cards && data.cards[0]) {
                setupCard(sk, folder, data, data.cards[0]);
              }
            })
            .catch(e => {
              console.error('加载卡片失败:', e);
              sk.remove();
            })
            .finally(() => {
              loadedCount++;
              if (loadedCount >= batch.length) {
                isLoading = false;
                currentIndex += batch.length;

                if (currentIndex >= allFolders.length) {
                  loadMore.style.display = 'none';
                  allLoaded.style.display = 'block';
                } else {
                  loadMoreText.style.display = 'block';
                  loadMoreSpinner.style.display = 'none';
                }
              }
            });
        });
      }
    });

    // 导航栏搜索功能
    function setupNavbarSearch() {
      const navbar = document.querySelector('mc-navbar');
      if (!navbar) return;

      // 监听自定义搜索事件
      navbar.addEventListener('search', (e) => {
        const query = e.detail.query;
        performGlobalSearch(query);
      });
    }

    // 全局搜索
    async function performGlobalSearch(query) {
      if (!query || !query.trim()) return;

      try {
        const response = await fetch(`${RESOURCE_PATH}/folders.json`);
        const folders = await response.json();

        const results = [];
        for (const folder of folders) {
          try {
            const res = await fetch(`${RESOURCE_PATH}/${folder}/${folder}.json`);
            const data = await res.json();
            if (data.cards && data.cards[0]) {
              const card = data.cards[0];
              const title = (card.title || '').toLowerCase();
              const intro = (card.intro || '').toLowerCase();
              const category = (data.category || '').toLowerCase();
              const q = query.toLowerCase();

              if (title.includes(q) || intro.includes(q) || category.includes(q)) {
                results.push({ folder, data, card });
              }
            }
          } catch (e) {}
        }

        // 存储结果并跳转
        sessionStorage.setItem('search_query', query);
        sessionStorage.setItem('search_results', JSON.stringify(results));
        window.location.href = 'search-results.html';
      } catch (e) {
        console.error('搜索失败:', e);
      }
    }

    setupNavbarSearch();
  </script>
</body>
</html>
