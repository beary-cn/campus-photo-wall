<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../components/mc-navbar.js"></script>
    <script src="../../components/skeleton-card.js"></script>
    <link rel="stylesheet" href="../../css/style.css">
    <title>照片墙 - 校园照片墙</title>
</head>
<body>
    <mc-navbar icon-type="grass" icon-color="#4a90d9" search-placeholder="搜索照片 / 图集..."></mc-navbar>

    <div class="page-wrapper">
        <div class="main-container">
            <div class="page-header">
                <h1>📷 照片墙</h1>
                <p>按分类浏览全部校园照片，点击卡片查看图集详情，悬停可快速预览大图。</p>
            </div>

            <div class="gallery-layout">
                <!-- 左侧分类栏 -->
                <aside class="sidebar" id="sidebar">
                    <div class="sidebar-title">分类</div>
                </aside>

                <!-- 主内容区 -->
                <main class="gallery-main">
                    <div class="toolbar">
                        <span class="result-info" id="resultInfo">加载中...</span>
                        <div class="search-wrapper">
                            <input type="text" id="searchInput" placeholder="搜索标题 / 描述...">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.34-4.34"></path>
                            </svg>
                        </div>
                        <select class="sort-select" id="sortSelect">
                            <option value="newest">最新发布</option>
                            <option value="oldest">最旧发布</option>
                            <option value="name">名称排序</option>
                        </select>
                    </div>

                    <div class="cards-grid" id="cardsGrid">
                        <div class="loading-state">
                            <div class="loading-spinner"></div>
                            <p>正在加载照片...</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- 大图预览模态框 -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
        </div>
    </div>

    <style>
        .gallery-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #fff;
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 84px;
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px 12px;
        }

        .cat-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            text-align: left;
        }

        .cat-link:hover { background: var(--bg-secondary); }
        .cat-link.active { background: var(--accent-color); color: #fff; }
        .cat-link.active .cat-count { background: rgba(255,255,255,0.25); color: #fff; }

        .cat-count {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 1px 9px;
            border-radius: 999px;
        }

        .gallery-main { flex: 1; min-width: 0; }

        .cards-grid .photo-card { break-inside: auto; }

        @media (max-width: 992px) {
            .gallery-layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                position: static;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
            }
            .sidebar-title { width: 100%; }
        }
    </style>

    <script src="../../js/app.js"></script>
    <script>
        const PAGE_SIZE = 20;
        let allPhotos = [];
        let filtered = [];
        let currentPage = 1;
        let currentCat = 'all';
        let keyword = '';
        let currentSort = 'newest';

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            // 读取 URL 参数（从首页分类跳转）
            const params = new URLSearchParams(window.location.search);
            if (params.get('cat')) currentCat = params.get('cat');

            // 读取导航栏搜索关键词
            const savedKw = sessionStorage.getItem('wall_kw');
            if (savedKw !== null) {
                sessionStorage.removeItem('wall_kw');
                keyword = savedKw;
                document.getElementById('searchInput').value = keyword;
            }

            const grid = document.getElementById('cardsGrid');
            try {
                allPhotos = await fetchAllPhotos();
            } catch (e) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>${escapeHtml(e.message)}</p></div>`;
                return;
            }

            buildSidebar();
            setupEvents();
            applyFilter();
        }

        // 左侧分类栏
        function buildSidebar() {
            const sidebar = document.getElementById('sidebar');
            const counts = { 'all': allPhotos.length };
            CATEGORIES.forEach(c => { counts[c.key] = 0; });
            allPhotos.forEach(p => {
                const cat = p.categories[0] || '其他';
                if (counts[cat] !== undefined) counts[cat]++;
            });

            let html = `<div class="sidebar-title">分类</div>
                <button class="cat-link" data-cat="all">📁 全部 <span class="cat-count">${counts['all']}</span></button>`;
            CATEGORIES.forEach(c => {
                html += `<button class="cat-link" data-cat="${c.key}">${c.icon} ${c.key} <span class="cat-count">${counts[c.key] || 0}</span></button>`;
            });
            sidebar.innerHTML = html;

            sidebar.querySelectorAll('.cat-link').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === currentCat);
                btn.addEventListener('click', () => {
                    currentCat = btn.dataset.cat;
                    sidebar.querySelectorAll('.cat-link').forEach(b => b.classList.toggle('active', b === btn));
                    applyFilter();
                });
            });
        }

        // 筛选 + 排序
        function applyFilter() {
            filtered = allPhotos.filter(p => {
                if (currentCat !== 'all' && !p.categories.includes(currentCat)) return false;
                if (keyword) {
                    const kw = keyword.toLowerCase();
                    const text = (p.title + ' ' + p.intro).toLowerCase();
                    if (!text.includes(kw)) return false;
                }
                return true;
            });

            if (currentSort === 'newest') {
                filtered.sort((a, b) => String(b.date).localeCompare(String(a.date)));
            } else if (currentSort === 'oldest') {
                filtered.sort((a, b) => String(a.date).localeCompare(String(b.date)));
            } else {
                filtered.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
            }

            currentPage = 1;
            render();
        }

        // 渲染
        function render() {
            const grid = document.getElementById('cardsGrid');
            const info = document.getElementById('resultInfo');

            info.innerHTML = `共 <strong>${filtered.length}</strong> 个图集`;

            const loading = grid.querySelector('.loading-state');
            if (loading) loading.remove();

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>没有找到相关照片</h3><p>换个关键词或分类试试</p></div>`;
                return;
            }

            const end = currentPage * PAGE_SIZE;
            const items = filtered.slice(0, end);

            grid.innerHTML = '';
            items.forEach(p => {
                const card = createSkeletonCard(p);
                // 追加"查看大图"快捷按钮（取封面图预览）
                const wrap = card.shadowRoot.querySelector('.card-img');
                if (wrap) {
                    const btn = document.createElement('button');
                    btn.style.cssText = 'position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.92);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s,transform .25s;';
                    btn.title = '查看大图';
                    btn.textContent = '🔍';
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openModal(`${DATA_PATH}/${p.folder}/${p.cover}`, p.title, p.date, p.categories[0]);
                    });
                    btn.addEventListener('mouseenter', () => btn.style.opacity = '1');
                    card.addEventListener('mouseenter', () => btn.style.opacity = '1');
                    card.addEventListener('mouseleave', () => btn.style.opacity = '0');
                    wrap.appendChild(btn);
                }
                grid.appendChild(card);
            });

            // 简单分页
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
            const existing = document.getElementById('galleryPagination');
            if (existing) existing.remove();

            if (totalPages <= 1) return;

            const pag = document.createElement('div');
            pag.id = 'galleryPagination';
            pag.className = 'pagination';
            let html = '';
            html += `<button ${currentPage === 1 ? 'disabled' : ''} data-p="${currentPage - 1}">‹</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" data-p="${i}">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<button disabled>...</button>`;
                }
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-p="${currentPage + 1}">›</button>`;
            pag.innerHTML = html;
            pag.querySelectorAll('button[data-p]').forEach(b => {
                b.addEventListener('click', () => {
                    currentPage = parseInt(b.dataset.p);
                    render();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
            document.getElementById('cardsGrid').after(pag);
        }

        // 模态框
        function openModal(src, title, date, cat) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImage');
            img.onerror = () => { img.onerror = null; img.src = window.__PH__; };
            img.src = src;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMeta').textContent =
                [cat, date ? `📅 ${date}` : ''].filter(Boolean).join(' · ');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // 事件
        function setupEvents() {
            const searchInput = document.getElementById('searchInput');
            let timer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    keyword = e.target.value.trim();
                    applyFilter();
                }, 300);
            });

            document.getElementById('sortSelect').addEventListener('change', (e) => {
                currentSort = e.target.value;
                applyFilter();
            });

            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('imageModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }
    </script>
</body>
</html>
